# =============================================================================
# Data 360 Data Model (semantic layer for NL -> SQL segment building)
# =============================================================================
# PURPOSE
#   Single source of truth for the Data 360 data model as the agent should use it:
#     (a) FIELD METADATA  — the real DMO + field API names, data types, PII flags,
#         and what each field means in business terms (the "which field do I
#         filter on?" answer).
#     (b) RELATIONSHIPS    — the declared join graph: edges, join keys, cardinality,
#         and reusable multi-hop paths (the "how do I join them?" answer).
#
#   The agent must build queries from THIS FILE, not by inferring from field names.
#   In the SSOT model an "...Id" suffix does NOT imply a foreign key, and real
#   relationships are frequently on fields that carry no "Id" at all. Guessing
#   from names produces confident-but-wrong joins and silent double-counting.
#
# HOW IT'S POPULATED / VERIFIED
#   - Field-level facts (dmo, api_name, type, primary_key) can be SEEDED and
#     CONFIRMED from the org via the MCP Query family's metadata query (list DMOs
#     + describe fields). This half is machine-verifiable.
#   - Relationships, cardinality, identity-resolution routing, count semantics,
#     PII flags, and business descriptions are HUMAN-CURATED and architect-verified.
#     The metadata API does not reliably emit these.
#   See:  using-the-data-model.md            (how the agent uses this file)
#         before-using-and-on-data-model-changes.md  (how to verify / maintain it)
#
# ORG SEED (MCP, 2026-08-06)
#   Dataspace: Development (label DEV-US, prefix `dev`)
#   Seeded via: d360_dmo_list / d360_dmo_get / d360_query_sql (join sanity checks)
#   Populated entities below replace the generic ssot__* placeholders.
#   Row snapshot at seed time (approx):
#     Individual ~1.51M · UnifiedIndividual ~1.09M · IdentityLink ~1.51M
#     ContactPointEmail ~1.00M · EmailEngagement ~7.57M
#     ContactPointAddress / WebsiteEngagement / NBRxAggregated / ContactPointConsent
#       / ConsentPreference / HcpSegmentation → 0 rows (schema mapped; data empty)
#   Field api_name/type and relationships/cardinality marked status:verified
#   after metadata + join-count confirmation (2026-08-06). pii/desc remain
#   human-curated — re-review if business meaning is disputed.
#
# IDENTITY RESOLUTION RULE (important)
#   You CANNOT join the unified profile directly to a source individual. You must
#   traverse the identity link DMO:
#       UnifiedIndividual.Id__c
#           = IdentityLink.UnifiedRecordId__c
#       IdentityLink.SourceRecordId__c
#           = Individual.Id__c
#
# STATUS LEGEND (per entity / field / relationship)
#   verified   -> confirmed against the live org (metadata query and/or SME)
#   VERIFY     -> placeholder; confirm the DMO/field/type/cardinality before trusting
# =============================================================================

version: 1

defaults:
  dialect: postgresql          # Data 360 Query API v2 dialect
  dataspace: Development       # DEV-US; prefix `dev`
  anchor: UnifiedIndividual    # default "people" entity for counts
  # Counting rule: a person = one distinct anchor count_key, regardless of how
  # many child rows (Rx, engagements, accounts) they fan out to.

# -----------------------------------------------------------------------------
# ENTITIES  (nodes)  — DMO + field metadata
# -----------------------------------------------------------------------------
# Per entity:  dmo, label, status, desc, grain, count_key/primary_key
# Per field:   api_name (real column), label, type, status, pii (bool), desc, sampleValues?
#              -> `type` and `api_name` are metadata-query verifiable
#              -> `desc` and `pii` are human-curated context
#              -> `label` = the business-friendly display name shown to MARKETERS.
#              -> `sampleValues` = illustrative literals for low-cardinality non-PII
#                 categorical fields only. NEVER on PII / free-text / timestamps / IDs.
# -----------------------------------------------------------------------------
entities:

  # ---- Unified/resolved profile --------------------------------------------
  UnifiedIndividual:
    dmo: dev_UnifiedIndividualRs1__dlm
    label: HCP
    status: verified            # DMO exists + fields from d360_dmo_get 2026-08-06
    desc: >-
      Resolved "golden" HCP record (IR ruleset rs1) in the Development dataspace;
      the anchor for all people counts.
    grain: one row per resolved person
    count_key: Id__c            # COUNT(DISTINCT this) == # of people
    primary_key: Id__c
    fields:
      unified_record_id:
        api_name: Id__c
        label: HCP ID
        type: Text
        status: verified
        pii: false
        desc: Resolved-person primary key; join target from IdentityLink.UnifiedRecordId__c; count key.
      first_name:
        api_name: FirstName__c
        label: First name
        type: Text
        status: verified
        pii: true
        desc: Given name. Do not return in results — count only.
      last_name:
        api_name: LastName__c
        label: Last name
        type: Text
        status: verified
        pii: true
        desc: Family name. Do not return in results — count only.
      salutation:
        api_name: Salutation__c
        label: Salutation
        type: Text
        status: verified
        pii: false
        desc: Honorific (Mr., Mrs., Dr., ...). Non-PII; safe to filter on.
      birth_date:
        api_name: BirthDate__c
        label: Date of birth
        type: DateTime
        status: verified
        pii: true
        desc: HCP date of birth.
      primary_specialty:
        api_name: PrimarySpecialty__c
        label: Primary specialty
        type: Text
        status: verified
        pii: false
        desc: >-
          Clinical specialty label on the resolved profile. Observed all-null at seed
          (2026-08-06); keep for filters once populated.
      primary_specialty_code:
        api_name: PrimarySpecialtyCode__c
        label: Primary specialty code
        type: Text
        status: verified
        pii: false
        desc: Coded primary specialty.
      secondary_specialty:
        api_name: SecondarySpecialty__c
        label: Secondary specialty
        type: Text
        status: verified
        pii: false
        desc: Secondary clinical specialty label.
      profession:
        api_name: Profession__c
        label: Profession
        type: Text
        status: verified
        pii: false
        desc: Profession on the HCP profile.
      hcp_type:
        api_name: HcpType__c
        label: HCP type
        type: Text
        status: verified
        pii: false
        desc: HCP type classifier.
      hcp_status_code:
        api_name: HcpStatusCode__c
        label: HCP status
        type: Text
        status: verified
        pii: false
        desc: HCP status code.
      hcp_suppression:
        api_name: HcpSuppression__c
        label: HCP suppression
        type: Boolean
        status: verified
        pii: false
        desc: Suppression flag on the HCP profile.
        sampleValues: [true, false]
      pfizer_customer_id:
        api_name: PfizerCustomerId__c
        label: Pfizer customer ID
        type: Text
        status: verified
        pii: false
        desc: Pfizer customer identifier on the profile.
      pfizer_employee:
        api_name: PfizerEmployee__c
        label: Pfizer employee
        type: Boolean
        status: verified
        pii: false
        desc: Whether the person is a Pfizer employee.
        sampleValues: [true, false]
      registered_user:
        api_name: RegisteredUser__c
        label: Registered user
        type: Boolean
        status: verified
        pii: false
        desc: Whether the HCP is a registered user.
        sampleValues: [true, false]
      test_user:
        api_name: TestUser__c
        label: Test user
        type: Boolean
        status: verified
        pii: false
        desc: Test-user flag; typically exclude from production segments.
        sampleValues: [true, false]

  # ---- Identity Resolution link ---------------------------------------------
  IdentityLink:
    dmo: dev_UnifiedLinkIndividualRs1__dlm
    label: Identity link (internal)          # plumbing — not shown to marketers
    status: verified
    desc: >-
      Bridge between the unified profile and its source records (IR ruleset rs1).
      All unified<->source joins MUST route through this DMO — never join a unified
      profile directly to a source record.
    grain: one row per (unified record <-> source record) mapping
    fields:
      unified_record_id:
        api_name: UnifiedRecordId__c
        label: Unified HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> UnifiedIndividual.Id__c
      source_record_id:
        api_name: SourceRecordId__c
        label: Source HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c
      data_source_id:
        api_name: DataSourceId__c
        label: Data source
        type: Text
        status: verified
        pii: false
        desc: Source system for this link row (part of the bridge composite key).
      data_source_object_id:
        api_name: DataSourceObjectId__c
        label: Data source object
        type: Text
        status: verified
        pii: false
        desc: Source object for this link row (part of the bridge composite key).

  # ---- Source-level individual ----------------------------------------------
  Individual:
    dmo: dev_Individual__dlm
    label: HCP
    status: verified
    desc: >-
      Source-level HCP record (pre-resolution) in Development; carries the HCP
      attributes used in filters. ~1.51M rows at seed.
    primary_key: Id__c
    grain: one row per source-level individual
    fields:
      id:
        api_name: Id__c
        label: HCP ID
        type: Text
        status: verified
        pii: false
        desc: >-
          Source individual primary key; join target from IdentityLink.SourceRecordId__c
          and from child PartyId / IndividualId fields. Key qualifier companion: KQ_Id__c.
      party_id:
        api_name: PartyId__c
        label: Party ID
        type: Text
        status: verified
        pii: false
        desc: Party reference on the individual (distinct from Id__c in some mappings).
      birth_date:
        api_name: BirthDate__c
        label: Date of birth
        type: DateTime
        status: verified
        pii: true
        desc: HCP date of birth.
      first_name:
        api_name: FirstName__c
        label: First name
        type: Text
        status: verified
        pii: true
        desc: Given name. Do not return in results — count only.
      last_name:
        api_name: LastName__c
        label: Last name
        type: Text
        status: verified
        pii: true
        desc: Family name. Do not return in results — count only.
      middle_name:
        api_name: MiddleName__c
        label: Middle name
        type: Text
        status: verified
        pii: true
        desc: Middle name. Do not return in results — count only.
      salutation:
        api_name: Salutation__c
        label: Salutation
        type: Text
        status: verified
        pii: false
        desc: Honorific the person goes by (Mr., Mrs., Ms., Dr., ...). Non-PII, safe to filter on.
      primary_specialty:
        api_name: PrimarySpecialty__c
        label: Primary specialty
        type: Text
        status: verified
        pii: false
        desc: >-
          Clinical specialty. All-null at seed (2026-08-06) across ~1.51M rows —
          do not expect specialty filters to return matches until data lands.
      primary_specialty_code:
        api_name: PrimarySpecialtyCode__c
        label: Primary specialty code
        type: Text
        status: verified
        pii: false
        desc: Coded primary specialty.
      secondary_specialty:
        api_name: SecondarySpecialty__c
        label: Secondary specialty
        type: Text
        status: verified
        pii: false
        desc: Secondary clinical specialty.
      secondary_specialty_code:
        api_name: SecondarySpecialtyCode__c
        label: Secondary specialty code
        type: Text
        status: verified
        pii: false
        desc: Coded secondary specialty.
      profession:
        api_name: Profession__c
        label: Profession
        type: Text
        status: verified
        pii: false
        desc: Profession on the source HCP record.
      hcp_type:
        api_name: HcpType__c
        label: HCP type
        type: Text
        status: verified
        pii: false
        desc: HCP type classifier.
      hcp_status_code:
        api_name: HcpStatusCode__c
        label: HCP status
        type: Text
        status: verified
        pii: false
        desc: HCP status code.
      hcp_suppression:
        api_name: HcpSuppression__c
        label: HCP suppression
        type: Boolean
        status: verified
        pii: false
        desc: Suppression flag.
        sampleValues: [true, false]
      pfizer_customer_id:
        api_name: PfizerCustomerId__c
        label: Pfizer customer ID
        type: Text
        status: verified
        pii: false
        desc: Pfizer customer identifier.
      pfizer_employee:
        api_name: PfizerEmployee__c
        label: Pfizer employee
        type: Boolean
        status: verified
        pii: false
        desc: Whether the person is a Pfizer employee.
        sampleValues: [true, false]
      registered_user:
        api_name: RegisteredUser__c
        label: Registered user
        type: Boolean
        status: verified
        pii: false
        desc: Whether the HCP is a registered user.
        sampleValues: [true, false]
      test_user:
        api_name: TestUser__c
        label: Test user
        type: Boolean
        status: verified
        pii: false
        desc: Test-user flag; typically exclude from production segments.
        sampleValues: [true, false]
      validation_status:
        api_name: ValidationStatus__c
        label: Validation status
        type: Text
        status: verified
        pii: false
        desc: Profile validation status.
      gender:
        api_name: GenderId__c
        label: Gender
        type: Text
        status: verified
        pii: true
        desc: Gender code/id. Treat as PII; prefer count-only use.

  # ---- Contact point: email -------------------------------------------------
  ContactPointEmail:
    dmo: dev_ContactPointEmail__dlm
    label: Email
    status: verified
    optional: true
    desc: >-
      Email contact points attached to the source Individual via PartyId.
      One person can have many. Source of "has email". Opt-in/out is NOT on this
      DMO in Development — see ContactPointConsent / ConsentPreference / EmailEngagement.
    primary_key: Id__c
    grain: one row per email contact point
    fields:
      id:
        api_name: Id__c
        label: Email contact point ID
        type: Text
        status: verified
        pii: false
        desc: Contact-point primary key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c (party-linking pattern; join confirmed 2026-08-06).
      email_address:
        api_name: EmailAddress__c
        label: Email address
        type: Text
        status: verified
        pii: true
        desc: Email address. Presence used for "has email"; never returned.
      email_domain:
        api_name: EmailDomain__c
        label: Email domain
        type: Text
        status: verified
        pii: false
        desc: Domain portion of the email; non-PII categorical when needed.
      is_active:
        api_name: IsActive__c
        label: Active
        type: Text
        status: verified
        pii: false
        desc: Active flag on the contact point (stored as Text in this org).
      primary_flag:
        api_name: PrimaryFlag__c
        label: Primary email
        type: Text
        status: verified
        pii: false
        desc: Whether this is the primary email contact point.

  # ---- Contact point: address -----------------------------------------------
  ContactPointAddress:
    dmo: dev_ContactPointAddress__dlm
    label: Address
    status: verified
    desc: >-
      Postal/geographic contact points attached to the source Individual via PartyId.
      State/region lives here (StateProvinceId__c) — NOT on Individual.
      Schema mapped; 0 rows at seed (2026-08-06) — state filters will return 0 until data lands.
    primary_key: Id__c
    grain: one row per address contact point
    fields:
      id:
        api_name: Id__c
        label: Address contact point ID
        type: Text
        status: verified
        pii: false
        desc: Contact-point primary key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c (party-linking pattern).
      state:
        api_name: StateProvinceId__c
        label: State/region
        type: Text
        status: verified
        pii: false
        desc: >-
          State/region on the address. Map spoken names to stored codes
          ("Utah" -> 'UT') once values are observed. Empty table at seed.
      country:
        api_name: CountryId__c
        label: Country
        type: Text
        status: verified
        pii: false
        desc: Country on the address.
      city:
        api_name: CityId__c
        label: City
        type: Text
        status: verified
        pii: false
        desc: City on the address.
      postal_code:
        api_name: PostalCodeId__c
        label: Postal code
        type: Text
        status: verified
        pii: false
        desc: Postal/ZIP code. Useful for radius asks once geo logic is approved.
      address_line_1:
        api_name: AddressLine1__c
        label: Address line 1
        type: Text
        status: verified
        pii: true
        desc: Street address. PII — never return; filter only if governance allows.
      is_active:
        api_name: IsActive__c
        label: Active
        type: Text
        status: verified
        pii: false
        desc: Active flag on the contact point.
      primary_flag:
        api_name: PrimaryFlag__c
        label: Primary address
        type: Text
        status: verified
        pii: false
        desc: Whether this is the primary address contact point.

  # ---- Contact point consent (opt-in / opt-out) ------------------------------
  ContactPointConsent:
    dmo: dev_ContactPointConsent__dlm
    label: Consent
    status: verified
    optional: true
    desc: >-
      Consent granted by a party for a specific contact point (where/when/how/purpose).
      Preferred source of "opted-in / emailable" once populated. 0 rows at seed
      (2026-08-06) — until then, EmailEngagement "Opt Out" action is the only observed
      opt-out signal in Development.
    primary_key: Id__c
    grain: one row per contact-point consent record
    fields:
      id:
        api_name: Id__c
        label: Consent ID
        type: Text
        status: verified
        pii: false
        desc: Consent primary key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c
      contact_point_id:
        api_name: ContactPointId__c
        label: Contact point ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> ContactPointEmail.Id__c (or other contact point).
      consent_status:
        api_name: ConsentStatusId__c
        label: Consent status
        type: Text
        status: verified
        pii: false
        desc: >-
          Consent status id. Opted-in / emailable in live segments uses
          ConsentStatusId__c IN ('IN', 'UNKNOWN') — harvested from
          DEV_CIA_Nurtec_HCP_Segmentation / DEV_CIA_HCP_Marketable_Email (2026-08-06).
          Stream DEV_HCP_OT_CONSENT_PREFERENCES is NEEDS_ACTIVATION (0 rows today).
        sampleValues: ["IN", "UNKNOWN"]
      consent_captured_date:
        api_name: ConsentCapturedDateTime__c
        label: Consent captured date/time
        type: DateTime
        status: verified
        pii: false
        desc: When consent was captured.
      effective_from:
        api_name: EffectiveFromDate__c
        label: Effective from
        type: DateTime
        status: verified
        pii: false
        desc: Consent effective-from timestamp.
      effective_to:
        api_name: EffectiveToDate__c
        label: Effective to
        type: DateTime
        status: verified
        pii: false
        desc: Consent effective-to timestamp.

  # ---- Consent preference ---------------------------------------------------
  ConsentPreference:
    dmo: dev_ConsentPreference__dlm
    label: Consent preference
    status: verified
    optional: true
    desc: >-
      Preference name/type/value rows tied to a contact-point consent.
      Schema mapped; 0 rows at seed (2026-08-06). Fed by stream
      DEV_HCP_OT_CONSENT_PREFERENCES (NEEDS_ACTIVATION).
    primary_key: ConsentPreferenceId__c
    grain: one row per preference
    data_stream: DEV_HCP_OT_CONSENT_PREFERENCES
    fields:
      id:
        api_name: ConsentPreferenceId__c
        label: Consent preference ID
        type: Text
        status: verified
        pii: false
        desc: Preference primary key.
      contact_point_consent_id:
        api_name: ContactPointConsentId__c
        label: Contact point consent ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> ContactPointConsent.Id__c
      preference_name:
        api_name: PreferenceName__c
        label: Preference name
        type: Text
        status: verified
        pii: false
        desc: >-
          Preference name. Live Nurtec segment filters PreferenceName IN ('ALL','NURTEC').
        sampleValues: ["ALL", "NURTEC"]
      preference_type:
        api_name: PreferenceType__c
        label: Preference type
        type: Text
        status: verified
        pii: false
        desc: Preference type classifier. Live brand-consent segments use 'Brand'.
        sampleValues: ["Brand"]
      preference_value:
        api_name: PreferenceValue__c
        label: Preference value
        type: Text
        status: verified
        pii: false
        desc: >-
          Preference value literal. Opted-in brand preference uses 'IN'
          (from DEV_CIA_Nurtec_HCP_Segmentation).
        sampleValues: ["IN"]

  # ---- Website engagement events --------------------------------------------
  WebsiteEngagement:
    dmo: dev_WebsiteEngagement__dlm
    label: Website engagement
    status: verified
    desc: >-
      Website engagement events per person; source of "visited the website".
      Schema mapped; 0 rows at seed (2026-08-06). Has Indication + TherapeuticArea
      for site/brand context once populated.
    primary_key: Id__c
    grain: one row per website engagement event
    fields:
      id:
        api_name: Id__c
        label: Website engagement ID
        type: Text
        status: verified
        pii: false
        desc: Event primary key.
      individual_id:
        api_name: IndividualId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c
      engagement_date:
        api_name: EngagementDateTm__c
        label: Engagement date/time
        type: DateTime
        status: verified
        pii: false
        desc: Event time; drives "within last N days" windows.
      engagement_type:
        api_name: EngagementTypeId__c
        label: Engagement type
        type: Text
        status: verified
        pii: false
        desc: Engagement type classifier. VERIFY real literals once data lands.
      page_name:
        api_name: PageName__c
        label: Page name
        type: Text
        status: verified
        pii: false
        desc: Page name for the visit.
      page_url:
        api_name: PageURL__c
        label: Page URL
        type: Text
        status: verified
        pii: false
        desc: Page URL; may help distinguish corporate vs brand sites.
      indication:
        api_name: Indication__c
        label: Indication
        type: Text
        status: verified
        pii: false
        desc: Indication associated with the engagement (custom).
      therapeutic_area:
        api_name: TherapeuticArea__c
        label: Therapeutic area
        type: Text
        status: verified
        pii: false
        desc: Therapeutic area associated with the engagement (custom).
      country:
        api_name: CountryId__c
        label: Country
        type: Text
        status: verified
        pii: false
        desc: Country on the engagement event.

  # ---- Email engagement events ----------------------------------------------
  EmailEngagement:
    dmo: dev_EmailEngagement__dlm
    label: Email engagement
    status: verified
    desc: >-
      Email engagement events (send/open/click/bounce/opt-out/complaint) per person.
      ~7.57M rows at seed. Also an interim opt-out signal via EngagementChannelActionId
      = 'Opt Out' while ContactPointConsent is empty.
    primary_key: Id__c
    grain: one row per email engagement event
    fields:
      id:
        api_name: Id__c
        label: Email engagement ID
        type: Text
        status: verified
        pii: false
        desc: Event primary key.
      individual_id:
        api_name: IndividualId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c (join confirmed 2026-08-06).
      engagement_date:
        api_name: EngagementDateTm__c
        label: Engagement date/time
        type: DateTime
        status: verified
        pii: false
        desc: Event time; drives "opened/clicked in last N days".
      engagement_channel_action:
        api_name: EngagementChannelActionId__c
        label: Engagement action
        type: Text
        status: verified
        pii: false
