# -----------------------------------------------------------------------------
# RELATIONSHIPS  (edges)  -- declared, directional, with cardinality
# -----------------------------------------------------------------------------
# Join keys + cardinality verified 2026-08-06 against Development via MCP
# (d360_dmo_get + join-count SQL). Note: Id__c may still pair with KQ_* key
# qualifiers for segment SQL projection — see creating-segments.md.
# -----------------------------------------------------------------------------
relationships:

  - name: unified_to_identitylink
    status: verified
    kind: identity_resolution
    from: UnifiedIndividual
    to: IdentityLink
    from_key: Id__c
    to_key: UnifiedRecordId__c
    cardinality: one_to_many                # ~1.09M unified → ~1.51M links at seed

  - name: identitylink_to_individual
    status: verified
    kind: identity_resolution
    from: IdentityLink
    to: Individual
    from_key: SourceRecordId__c
    to_key: Id__c
    cardinality: one_to_one                 # each link row maps to one source individual

  - name: individual_has_email
    status: verified
    kind: contact_point
    from: Individual
    to: ContactPointEmail
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # join confirmed 2026-08-06 (~1.4M matches)

  - name: individual_has_address
    status: verified
    kind: contact_point
    from: Individual
    to: ContactPointAddress
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # keys confirmed; 0 address rows at seed

  - name: individual_has_consent
    status: verified
    kind: consent
    from: Individual
    to: ContactPointConsent
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # keys confirmed; 0 consent rows at seed

  - name: consent_has_preference
    status: verified
    kind: consent
    from: ContactPointConsent
    to: ConsentPreference
    from_key: Id__c
    to_key: ContactPointConsentId__c
    cardinality: one_to_many                # keys confirmed; 0 preference rows at seed

  - name: individual_has_website_engagement
    status: verified
    kind: engagement_event
    from: Individual
    to: WebsiteEngagement
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many                # keys confirmed; 0 website rows at seed

  - name: individual_has_email_engagement
    status: verified
    kind: engagement_event
    from: Individual
    to: EmailEngagement
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many                # join confirmed 2026-08-06 (~7.57M events)

  - name: individual_has_nbrx
    status: verified
    kind: transactional_event
    from: Individual
    to: NBRxAggregated
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many                # keys confirmed; 0 NBRx rows at seed

  - name: individual_has_hcp_segmentation
    status: verified
    kind: attribute
    from: Individual
    to: HcpSegmentation
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many                # keys confirmed; 0 rows at seed

  - name: individual_has_header_unsubscribe
    status: verified
    kind: consent
    from: Individual
    to: HeaderUnsubscribeBrand
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many                # SFMC header-unsubscribe brand events

# -----------------------------------------------------------------------------
# PATHS  (named multi-hop traversals)  -- reusable join chains
# -----------------------------------------------------------------------------
paths:

  unified_individual_to_source:
    description: Resolve a unified profile down to its source individual record(s).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_email:
    description: From a resolved person to their email contact points.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_email
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_address:
    description: From a resolved person to their address contact points (state/region).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_address
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_consent:
    description: From a resolved person to contact-point consent (opt-in / opt-out).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_consent
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_website_engagement:
    description: From a resolved person to their website engagement events.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_website_engagement
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_email_engagement:
    description: From a resolved person to their email engagement events (open/click/opt-out).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_email_engagement
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_nbrx:
    description: From a resolved HCP to aggregated NBRx by brand.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_nbrx
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_hcp_segmentation:
    description: From a resolved HCP to brand/indication segmentation attributes.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_hcp_segmentation
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_header_unsubscribe:
    description: From a resolved HCP to SFMC header-unsubscribe brand events.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_header_unsubscribe
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

# -----------------------------------------------------------------------------
# JOURNEYS  (worked NL examples -> how the pieces assemble)
# -----------------------------------------------------------------------------
journeys:

  brand_web_visitors_by_state:
    intent: "How many opted-in <brand> HCPs in <state> visited the website in the last 60 days?"
    anchor: UnifiedIndividual
    path: unified_individual_to_website_engagement
    also_join: unified_individual_to_address
    # Also consider unified_individual_to_consent when ContactPointConsent is populated.
    # Brand may come from WebsiteEngagement.indication/therapeutic_area or HcpSegmentation.
    filters:
      - "WebsiteEngagement.engagement_date >= CURRENT_DATE - INTERVAL '60 days'"
      - "ContactPointAddress.state = 'NY'"            # spoken name -> code; state on address
      # opt-in: ContactPointConsent.consent_status = '<OptIn literal>' when data lands
      # interim opt-out signal via email eng: NOT EXISTS EngagementChannelActionId = 'Opt Out'
    count: "COUNT(DISTINCT UnifiedIndividual.count_key)"
    # Assembled SQL (identity-resolution path via the link DMO):
    #
    #   SELECT COUNT(DISTINCT ui."Id__c") AS person_count
    #   FROM "dev_UnifiedIndividualRs1__dlm" ui
    #   JOIN "dev_UnifiedLinkIndividualRs1__dlm" link
    #     ON link."UnifiedRecordId__c" = ui."Id__c"
    #   JOIN "dev_Individual__dlm" i
    #     ON i."Id__c" = link."SourceRecordId__c"
    #   JOIN "dev_ContactPointAddress__dlm" addr
    #     ON addr."PartyId__c" = i."Id__c"
    #   JOIN "dev_WebsiteEngagement__dlm" web
    #     ON web."IndividualId__c" = i."Id__c"
    #   WHERE addr."StateProvinceId__c" = 'NY'
    #     AND web."EngagementDateTm__c" >= CURRENT_DATE - INTERVAL '60 days';
    #
    # NOTE (2026-08-06): Address + WebsiteEngagement have 0 rows in Development —
    # this journey will count 0 until those streams are loaded.
    caveats:
      - "Address and WebsiteEngagement empty at seed — expect 0 until data lands."
      - "Brand affiliation is not a field on Individual; use WebsiteEngagement or HcpSegmentation."

  email_openers_last_90_days:
    intent: "How many HCPs opened a customer email in the last 90 days?"
    anchor: UnifiedIndividual
    path: unified_individual_to_email_engagement
    filters:
      - "EmailEngagement.engagement_channel_action = 'Open'"
      - "EmailEngagement.engagement_date >= CURRENT_DATE - INTERVAL '90 days'"
    count: "COUNT(DISTINCT UnifiedIndividual.count_key)"
    #   SELECT COUNT(DISTINCT ui."Id__c") AS person_count
    #   FROM "dev_UnifiedIndividualRs1__dlm" ui
    #   JOIN "dev_UnifiedLinkIndividualRs1__dlm" link
    #     ON link."UnifiedRecordId__c" = ui."Id__c"
    #   JOIN "dev_Individual__dlm" i
    #     ON i."Id__c" = link."SourceRecordId__c"
    #   JOIN "dev_EmailEngagement__dlm" ee
    #     ON ee."IndividualId__c" = i."Id__c"
    #   WHERE ee."EngagementChannelActionId__c" = 'Open'
    #     AND ee."EngagementDateTm__c" >= CURRENT_DATE - INTERVAL '90 days';

  hcp_wrote_nbrx_by_brand:
    intent: "How many HCPs have NBRx for <brand>?"
    anchor: UnifiedIndividual
    path: unified_individual_to_nbrx
    also_join: unified_individual_to_address   # for optional state filter when address data lands
    filters:
      - "NBRxAggregated.brand = '<brand>'"
      - "NBRxAggregated.nbrx_count > 0"
    count: "COUNT(DISTINCT UnifiedIndividual.count_key)"
    #   SELECT COUNT(DISTINCT ui."Id__c") AS hcp_count
    #   FROM "dev_UnifiedIndividualRs1__dlm" ui
    #   JOIN "dev_UnifiedLinkIndividualRs1__dlm" link
    #     ON link."UnifiedRecordId__c" = ui."Id__c"
    #   JOIN "dev_Individual__dlm" i
    #     ON i."Id__c" = link."SourceRecordId__c"
    #   JOIN "dev_NBRxAggregated__dlm" rx
    #     ON rx."IndividualId__c" = i."Id__c"
    #   WHERE rx."Brand__c" = '<brand>'
    #     AND rx."NBRxCount__c" > 0;
    #
    # NOTE (2026-08-06): NBRxAggregated has 0 rows in Development.
    caveats:
      - "NBRxAggregated empty at seed — expect 0 until data lands."

