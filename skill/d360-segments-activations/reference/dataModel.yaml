# =============================================================================
# Data 360 Data Model (semantic layer for NL -> SQL segment building)
# =============================================================================
# PURPOSE
#   Single source of truth for the Data 360 data model as the agent should use it:
#     (a) FIELD METADATA  — the real DMO + field API names, data types, PII flags,
#         and what each field means in business terms (the "which field do I
#         filter on?" answer).
#     (b) RELATIONSHIPS    — the declared join graph: edges, join keys, cardinality,
#         and reusable multi-hop paths (the "how do I join them?" answer).
#
#   The agent must build queries from THIS FILE, not by inferring from field names.
#   In the SSOT model an "...Id" suffix does NOT imply a foreign key, and real
#   relationships are frequently on fields that carry no "Id" at all. Guessing
#   from names produces confident-but-wrong joins and silent double-counting.
#
# HOW IT'S POPULATED / VERIFIED
#   - Field-level facts (dmo, api_name, type, primary_key) can be SEEDED and
#     CONFIRMED from the org via the MCP Query family's metadata query (list DMOs
#     + describe fields). This half is machine-verifiable.
#   - Relationships, cardinality, identity-resolution routing, count semantics,
#     PII flags, and business descriptions are HUMAN-CURATED and architect-verified.
#     The metadata API does not reliably emit these.
#   See:  using-the-data-model.md            (how the agent uses this file)
#         before-using-and-on-data-model-changes.md  (how to verify / maintain it)
#
# IDENTITY RESOLUTION RULE (important)
#   You CANNOT join the unified profile directly to a source individual. You must
#   traverse the identity link DMO:
#       UnifiedIndividual.UnifiedRecordId__c
#           = IdentityLink.UnifiedRecordId__c
#       IdentityLink.SourceRecordId__c
#           = Individual.ssot__Id__c
#
# STATUS LEGEND (per entity / field / relationship)
#   verified   -> confirmed against the live org (metadata query and/or SME)
#   VERIFY     -> placeholder; confirm the DMO/field/type/cardinality before trusting
# =============================================================================

version: 1

defaults:
  dialect: postgresql          # Data 360 Query API v2 dialect
  anchor: UnifiedIndividual    # default "people" entity for counts
  # Counting rule: a person = one distinct anchor count_key, regardless of how
  # many child rows (Rx, engagements, accounts) they fan out to.

# -----------------------------------------------------------------------------
# ENTITIES  (nodes)  — DMO + field metadata
# -----------------------------------------------------------------------------
# Per entity:  dmo, label, status, desc, grain, count_key/primary_key
# Per field:   api_name (real column), label, type, status, pii (bool), desc, sampleValues?
#              -> `type` and `api_name` are metadata-query verifiable
#              -> `desc` and `pii` are human-curated context
#              -> `label` = the business-friendly display name shown to MARKETERS. This is
#                 the presentation layer: user-facing output uses `label` (e.g. "HCP",
#                 "Salutation"), NEVER the raw `dmo`/`api_name` or SQL. Because it lives in
#                 this locked artifact, it works in `strict` mode with no live metadata call.
#                 (Seeded from the org's DMO/field labels; human-curated for marketer clarity.)
#              -> `desc` is STRUCTURED semantics the agent reads (not a comment);
#                 `#` comments are dividers / maintainer notes for humans only.
#              -> `sampleValues` = a few illustrative literals so the agent can map
#                 user phrasing to the real stored value ("Utah" -> 'UT'). ONLY on
#                 low-cardinality categorical/coded fields. NEVER on PII, free-text,
#                 timestamps, or ID/join keys. Illustrative + VERIFY, NOT the full domain.
# -----------------------------------------------------------------------------
entities:

  # ---- Unified/resolved profile --------------------------------------------
  UnifiedIndividual:
    dmo: UnifiedssotIndividual__dlm         # VERIFY exact API name via metadata query
    label: HCP                              # marketer-facing name
    status: VERIFY
    desc: Resolved "golden" person record; the anchor for all people counts.
    grain: one row per resolved person
    count_key: UnifiedRecordId__c           # COUNT(DISTINCT this) == # of people
    fields:
      unified_record_id:
        api_name: UnifiedRecordId__c
        label: HCP ID
        type: Text
        status: VERIFY
        pii: false
        desc: Resolved-person key; join toward the identity link and the count key.

  # ---- Identity Resolution link ---------------------------------------------
  IdentityLink:
    dmo: UnifiedIndividualIdentityLink__dlm  # VERIFY exact API name via metadata query
    label: Identity link (internal)          # plumbing — not shown to marketers
    status: VERIFY
    desc: >-
      Bridge between the unified profile and its source records. All unified<->source
      joins MUST route through this DMO — never join a unified profile directly to a source record.
    grain: one row per (unified record <-> source record) mapping
    fields:
      unified_record_id:
        api_name: UnifiedRecordId__c
        type: Text
        status: VERIFY
        pii: false
        desc: -> UnifiedIndividual.UnifiedRecordId__c
      source_record_id:
        api_name: SourceRecordId__c
        type: Text
        status: VERIFY
        pii: false
        desc: -> Individual.ssot__Id__c

  # ---- Source-level individual ----------------------------------------------
  Individual:
    dmo: ssot__Individual__dlm
    label: HCP                               # marketer-facing name (source-level details)
    status: VERIFY                           # confirm against the customer org
    desc: Source-level HCP record (pre-resolution); carries the HCP attributes used in filters.
    primary_key: ssot__Id__c
    grain: one row per source-level individual
    fields:
      id:
        api_name: ssot__Id__c
        label: HCP ID
        type: Text
        status: Verfied
        pii: false
        desc: Source individual primary key; join target from the identity link.
      birth_date:
        api_name: ssot__BirthDate__c
        label: Date of birth
        type: TimestampTZ
        status: VERIFY
        pii: true
        desc: HCP date of birth.
      first_name:
        api_name: ssot__FirstName__c
        label: First name
        type: Text
        status: Verified
        pii: true
        desc: Given name. Do not return in results — count only.
      last_name:
        api_name: ssot__LastName__c
        label: Last name
        type: Text
        status: VERIFY
        pii: true
        desc: Family name. Do not return in results — count only.
      salutation:
        api_name: ssot__Salutation__c
        label: Salutation
        type: Text
        # api_name + type metadata-confirmed against org trialsignup-d6178fbc40eb88 (2026-07-22);
        # desc/pii/sampleValues human-curated -> stays VERIFY until architect sign-off.
        status: VERIFY
        pii: false
        desc: >-
          Honorific the person goes by (Mr., Mrs., Ms., Dr., ...). Non-PII, safe to filter on.
          Map spoken forms to the stored literal — note values carry a trailing period ("Mr" -> 'Mr.').
        sampleValues: ["Mr."]   # observed 2026-07-22: 1/7 populated 'Mr.', 6 blank ('')
      # NOTE: state/region is NOT a field on Individual in the SSOT model.
      # Confirmed against the live org (2026-07-14): ssot__Individual__dlm has no
      # ssot__State__c column. State lives on ContactPointAddress (below), reached
      # via PartyId — the same pattern as email. Do not add a state field here.
      title:
        api_name: ssot__TitleName__c
        label: Title
        # metadata-confirmed field on ssot__Individual__dlm (2026-07-27). DISTINCT from
        # `salutation` — this is the job/professional title, NOT the Mr./Mrs./Dr. honorific.
        type: Text
        status: VERIFY
        pii: false
        desc: >-
          Professional/job title (e.g. "Chief of Cardiology"). Do NOT map the spoken honorific
          "Mr"/"Dr" here — that's `salutation`. Use this only when the user means job title.
      brand_affiliation:
        api_name: BrandAffiliation__c
        label: Brand affiliation
        type: Text
        status: VERIFY
        pii: false
        desc: Brand tie on the profile. VERIFY name + allowed values.
        sampleValues: ["<brand-a>", "<brand-b>"]  # placeholders; architect fills real values

  # ---- Individual Profile (distinct customer-master DMO) --------------------
  IndividualProfile:
    dmo: IndividualProfile__dlm              # VERIFY exact API name via metadata query
    label: Individual Profile
    status: VERIFY                           # api_name/type below are metadata-confirmed; relationships to
                                              # UnifiedIndividual/IdentityLink/Individual are NOT yet mapped
    desc: >-
      Pfizer customer-master HCP profile record, seeded from a Data Cloud Data Model export
      (2026-08-06) — a DIFFERENT DMO than ssot__Individual__dlm above (field naming has no "ssot__"
      prefix). Do NOT assume PartyId__c/Id__c line up with the joins declared elsewhere in this file
      until an architect confirms how this DMO relates to UnifiedIndividual/IdentityLink/Individual.
    primary_key: Id__c
    grain: one row per individual profile record
    fields:
      id:
        api_name: Id__c
        label: Individual Id
        type: Text
        status: verified
        pii: false
        desc: Primary key for this DMO.
      party_id:
        api_name: PartyId__c
        label: Party
        type: Text
        status: verified
        pii: false
        desc: Party-linking key. VERIFY how this relates to the Individual.ssot__PartyId__c pattern before joining.
      kq_id:
        api_name: KQ_Id__c
        label: Key Qualifier Individual Id
        type: Text
        status: verified
        pii: false
        desc: '"Individual Id" Key Qualifier.'
      first_name:
        api_name: FirstName__c
        label: First Name
        type: Text
        status: verified
        pii: true
        desc: Given name. Do not return in results — count only.
      middle_name:
        api_name: MiddleName__c
        label: Middle Name
        type: Text
        status: verified
        pii: true
        desc: Middle name. Do not return in results — count only.
      last_name:
        api_name: LastName__c
        label: Last Name
        type: Text
        status: verified
        pii: true
        desc: Family name. Do not return in results — count only.
      second_last_name:
        api_name: SecondLastName__c
        label: Second Last Name
        type: Text
        status: verified
        pii: true
        desc: Second/maternal family name (common in some locales). Do not return in results — count only.
      name_suffix:
        api_name: NameSuffix__c
        label: Name Suffix
        type: Text
        status: verified
        pii: false
        desc: Suffix (Jr., Sr., III, ...).
      salutation:
        api_name: Salutation__c
        label: Salutation
        type: Text
        status: verified
        pii: false
        desc: Honorific (Mr., Mrs., Dr., ...). Non-PII, safe to filter on.
      birth_date:
        api_name: BirthDate__c
        label: Birth Date
        type: DateTime
        status: verified
        pii: true
        desc: HCP date of birth.
      gender:
        api_name: GenderId__c
        label: Gender
        type: Text
        status: verified
        pii: true
        desc: Coded gender value. Enable Value Suggestion = true in the org; VERIFY the allowed-value list before mapping spoken terms.
      occupation:
        api_name: Occupation__c
        label: Occupation
        type: Text
        status: verified
        pii: false
        desc: Free-text/coded occupation.
      profession:
        api_name: Profession__c
        label: Profession
        type: Text
        status: verified
        pii: false
        desc: Coded profession. Enable Value Suggestion = true; VERIFY allowed values.
      primary_specialty:
        api_name: PrimarySpecialty__c
        label: Primary Specialty
        type: Text
        status: verified
        pii: false
        desc: Primary medical specialty (display value). Enable Value Suggestion = true; VERIFY allowed values.
      primary_specialty_code:
        api_name: PrimarySpecialtyCode__c
        label: Primary Specialty Code
        type: Text
        status: verified
        pii: false
        desc: Coded form of primary_specialty. Enable Value Suggestion = true; VERIFY allowed values.
      secondary_specialty:
        api_name: SecondarySpecialty__c
        label: Secondary Specialty
        type: Text
        status: verified
        pii: false
        desc: Secondary medical specialty (display value). Enable Value Suggestion = true; VERIFY allowed values.
      secondary_specialty_code:
        api_name: SecondarySpecialtyCode__c
        label: Secondary Specialty Code
        type: Text
        status: verified
        pii: false
        desc: Coded form of secondary_specialty. Enable Value Suggestion = true; VERIFY allowed values.
      hcp_type:
        api_name: HcpType__c
        label: Hcp Type
        type: Text
        status: verified
        pii: false
        desc: Coded HCP type classification. Enable Value Suggestion = true; VERIFY allowed values.
      hcp_status_code:
        api_name: HcpStatusCode__c
        label: Hcp Status Code
        type: Text
        status: verified
        pii: false
        desc: Coded HCP status. Enable Value Suggestion = true; VERIFY allowed values.
      hcp_suppression:
        api_name: HcpSuppression__c
        label: Hcp Suppression
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Suppression flag — likely governs whether the HCP should be excluded from outreach/segments.
          VERIFY exact business meaning before filtering on it.
      is_active:
        api_name: IsActive__c
        label: Is Active
        type: Boolean
        status: verified
        pii: false
        desc: Active-record flag.
      registered_user:
        api_name: RegisteredUser__c
        label: Registered User
        type: Boolean
        status: verified
        pii: false
        desc: Whether this HCP is a registered user (portal/site). VERIFY exact scope.
      pfizer_customer_id:
        api_name: PfizerCustomerId__c
        label: Pfizer Customer Id
        type: Text
        status: verified
        pii: false
        desc: Pfizer-internal customer identifier.
      pfizer_employee:
        api_name: PfizerEmployee__c
        label: Pfizer Employee
        type: Boolean
        status: verified
        pii: false
        desc: Flags Pfizer-employee records — likely excluded from HCP-facing segments. VERIFY exclusion rule with the architect.
      test_user:
        api_name: TestUser__c
        label: Test User
        type: Boolean
        status: verified
        pii: false
        desc: Flags test/synthetic records — should almost certainly be excluded from production segment counts. VERIFY exclusion rule with the architect.
      internal_organization:
        api_name: InternalOrganizationId__c
        label: Internal Organization
        type: Text
        status: verified
        pii: false
        desc: Internal organization reference. VERIFY join target/meaning.
      data_source:
        api_name: DataSourceId__c
        label: Data Source
        type: Text
        status: verified
        pii: false
        desc: Source system reference for this record.
      data_source_object:
        api_name: DataSourceObjectId__c
        label: Data Source Object
        type: Text
        status: verified
        pii: false
        desc: Source object reference for this record.
      external_record_id:
        api_name: ExternalRecordId__c
        label: External Record Id
        type: Text
        status: verified
        pii: false
        desc: Record identifier in the originating external source system.
      external_source_id:
        api_name: ExternalSourceId__c
        label: External Source Id
        type: Text
        status: verified
        pii: false
        desc: Identifier of the originating external source system.
      validation_status:
        api_name: ValidationStatus__c
        label: Validation Status
        type: Text
        status: verified
        pii: false
        desc: Coded record-validation status. Enable Value Suggestion = true; VERIFY allowed values.
      validation_date:
        api_name: ValidationDate__c
        label: Validation Date
        type: DateTime
        status: verified
        pii: false
        desc: Date the record was last validated.
      created_date:
        api_name: CreatedDate__c
        label: Created Date
        type: DateTime
        status: verified
        pii: false
        desc: Record creation timestamp.
      last_modified_date:
        api_name: LastModifiedDate__c
        label: Last Modified Date
        type: DateTime
        status: verified
        pii: false
        desc: Record last-modified timestamp.
      cdw_current_indicator:
        api_name: CdwCurrentIndicator__c
        label: Cdw Current Indicator
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Current-record indicator from the CDW source feed. Likely should be true-filtered to avoid
          counting superseded rows — VERIFY with the architect.
      cdw_delete_indicator:
        api_name: CdwDeleteIndicator__c
        label: Cdw Delete Indicator
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Delete/tombstone indicator from the CDW source feed. Likely should be false-filtered to
          exclude deleted rows — VERIFY with the architect.

  # ---- Contact point: email -------------------------------------------------
  ContactPointEmail:
    dmo: ssot__ContactPointEmail__dlm       # VERIFY exact API name via metadata query
    label: Email
    status: VERIFY
    optional: true                          # map when consent/email is in scope
    desc: >-
      Email contact points, attached to the source Individual via PartyId. One person can have
      many (personal, work, old, bounced). Source of "has email" / "opted-in / emailable".
    primary_key: ssot__Id__c
    grain: one row per email contact point
    fields:
      party_id:
        api_name: ssot__PartyId__c
        label: HCP ID (link)
        type: Text
        status: VERIFY
        pii: false
        desc: -> Individual.ssot__Id__c (party-linking pattern).
      email_address:
        api_name: ssot__EmailAddress__c
        label: Email address
        type: Text
        status: VERIFY
        pii: true
        desc: Email address. Presence used for "has email"; never returned.
      is_email_opt_out:
        api_name: ssot__IsEmailOptOut__c
        label: Email opt-out
        type: Boolean
        status: VERIFY
        pii: false
        desc: Opt-out flag. "opted-in / emailable" => is_email_opt_out = false.
        sampleValues: [true, false]
      contactability:
        api_name: ssot__ContactPointContactabilityStatus__c
        label: Contactability status
        type: Text
        status: VERIFY
        pii: false
        desc: Optional stricter contactability status.

  # ---- Contact point: address -----------------------------------------------
  ContactPointAddress:
    dmo: ssot__ContactPointAddress__dlm     # VERIFY exact API name via metadata query
    label: Address
    status: VERIFY
    desc: >-
      Postal/geographic contact points, attached to the source Individual via PartyId. One person can
      have many (home, work, historical). This is where state/region lives in the SSOT model — NOT on
      Individual. Source of the "in <state>" filter.
    primary_key: ssot__Id__c
    grain: one row per address contact point
    fields:
      party_id:
        api_name: ssot__PartyId__c
        label: HCP ID (link)
        type: Text
        status: VERIFY
        pii: false
        desc: -> Individual.ssot__Id__c (party-linking pattern).
      state:
        api_name: ssot__StateProvince__c
        label: State/region
        type: Text
        status: VERIFY
        pii: false
        desc: 'State/region on the address. Map spoken names to codes ("Utah" -> ''UT''). VERIFY exact api_name.'
        sampleValues: ["NY", "UT", "CA"]        # 2-letter codes; illustrative
      country:
        api_name: ssot__Country__c
        label: Country
        type: Text
        status: VERIFY
        pii: false
        desc: Country on the address. VERIFY exact api_name.

  # ---- Web engagement events ------------------------------------------------
  WebEngagement:
    dmo: WebEngagement__dlm                 # VERIFY exact API name via metadata query
    label: Website engagement
    status: VERIFY
    desc: Website engagement events per person; source of the "visited the website" filter.
    primary_key: EngagementId__c
    grain: one row per web engagement event
    fields:
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: VERIFY
        pii: false
        desc: -> Individual.ssot__Id__c (join key back toward the person).
      visit_ts:
        api_name: VisitTimestamp__c
        label: Visit date/time
        type: TimestampTZ
        status: VERIFY
        pii: false
        desc: Event time; drives "within last N days" windows.
      event_type:
        api_name: EventType__c
        label: Event type
        type: Text
        status: VERIFY
        pii: false
        desc: Optional event classifier (e.g. page view).
        sampleValues: ["PageView", "FormSubmit"]  # illustrative; VERIFY real values

  # ---- Prescription / Rx events ---------------------------------------------
  # Replace names with the real Rx / claims DMO once that data model is mapped.
  Prescription:
    dmo: Rx__dlm                            # VERIFY / example only
    label: Prescription
    status: VERIFY
    desc: >-
      Prescriptions written by HCPs; source of "wrote an Rx for <brand>". Example/placeholder
      until the real Rx/claims DMO is mapped.
    primary_key: PrescriptionId__c
    grain: one row per prescription written
    fields:
      prescriber_ref:
        api_name: PrescriberId__c
        label: Prescribing HCP (link)
        type: Text
        status: VERIFY
        pii: false
        desc: Prescribing HCP; join key back toward Individual. VERIFY.
      written_date:
        api_name: WrittenDate__c
        label: Date written
        type: TimestampTZ
        status: VERIFY
        pii: false
        desc: Date the Rx was written; drives "written in the last N days".
      product_name:
        api_name: DrugName__c
        label: Product/brand
        type: Text
        status: VERIFY
        pii: false
        desc: Brand/product on the script. VERIFY allowed values.
        sampleValues: ["<brand-a>", "<brand-b>"]  # placeholders; architect fills real values

# -----------------------------------------------------------------------------
# RELATIONSHIPS  (edges)  -- declared, directional, with cardinality
# -----------------------------------------------------------------------------
# HUMAN-CURATED. `from_key`/`to_key` are the join columns (referenced by the
# field `api_name`s above). `cardinality` drives fan-out handling.
# -----------------------------------------------------------------------------
relationships:

  # Identity resolution, hop 1 of 2: unified profile -> identity link
  - name: unified_to_identitylink
    status: VERIFY
    kind: identity_resolution
    from: UnifiedIndividual
    to: IdentityLink
    from_key: UnifiedRecordId__c
    to_key: UnifiedRecordId__c
    cardinality: one_to_many                # one unified profile -> many source links

  # Identity resolution, hop 2 of 2: identity link -> source individual
  - name: identitylink_to_individual
    status: VERIFY
    kind: identity_resolution
    from: IdentityLink
    to: Individual
    from_key: SourceRecordId__c
    to_key: ssot__Id__c
    cardinality: one_to_one                 # each link row maps to one source individual

  # Contact point: source individual -> email contact points
  - name: individual_has_email
    status: VERIFY
    kind: contact_point
    from: Individual
    to: ContactPointEmail
    from_key: ssot__Id__c
    to_key: ssot__PartyId__c
    cardinality: one_to_many                # one person -> many email contact points

  # Contact point: source individual -> address contact points (state/region lives here)
  - name: individual_has_address
    status: VERIFY
    kind: contact_point
    from: Individual
    to: ContactPointAddress
    from_key: ssot__Id__c
    to_key: ssot__PartyId__c
    cardinality: one_to_many                # one person -> many address contact points

  # Web engagement: source individual -> web events
  - name: individual_has_web_engagement
    status: VERIFY
    kind: engagement_event
    from: Individual
    to: WebEngagement
    from_key: ssot__Id__c
    to_key: PartyId__c                       # VERIFY on the real engagement DMO
    cardinality: one_to_many                 # one person -> many web events

  # Transactional event: HCP individual -> prescriptions they wrote
  - name: individual_wrote_prescription
    status: VERIFY
    kind: transactional_event
    from: Individual
    to: Prescription
    from_key: ssot__Id__c
    to_key: PrescriberId__c                  # VERIFY on the real Rx DMO
    cardinality: one_to_many                 # one HCP -> many prescriptions

# -----------------------------------------------------------------------------
# PATHS  (named multi-hop traversals)  -- reusable join chains
# -----------------------------------------------------------------------------
paths:

  # Reusable identity-resolution traversal: unified person -> source individual
  unified_individual_to_source:
    description: Resolve a unified profile down to its source individual record(s).
    hops:
      - unified_to_identitylink            # UnifiedIndividual -> IdentityLink
      - identitylink_to_individual         # IdentityLink      -> Individual
    dedupe_on: UnifiedIndividual.UnifiedRecordId__c
    fan_out: true

  unified_individual_to_email:
    description: From a resolved person to their email contact points.
    hops:
      - unified_to_identitylink            # UnifiedIndividual -> IdentityLink
      - identitylink_to_individual         # IdentityLink      -> Individual
      - individual_has_email               # Individual        -> ContactPointEmail
    dedupe_on: UnifiedIndividual.UnifiedRecordId__c
    fan_out: true

  unified_individual_to_address:
    description: From a resolved person to their address contact points (state/region).
    hops:
      - unified_to_identitylink            # UnifiedIndividual -> IdentityLink
      - identitylink_to_individual         # IdentityLink      -> Individual
      - individual_has_address             # Individual        -> ContactPointAddress
    dedupe_on: UnifiedIndividual.UnifiedRecordId__c
    fan_out: true

  unified_individual_to_web_engagement:
    description: From a resolved person to their website engagement events.
    hops:
      - unified_to_identitylink            # UnifiedIndividual -> IdentityLink
      - identitylink_to_individual         # IdentityLink      -> Individual
      - individual_has_web_engagement      # Individual        -> WebEngagement
    dedupe_on: UnifiedIndividual.UnifiedRecordId__c
    fan_out: true                           # 1:N present -> MUST count DISTINCT anchor

  unified_individual_to_prescriptions:
    description: From a resolved HCP to the prescriptions they wrote.
    hops:
      - unified_to_identitylink            # UnifiedIndividual -> IdentityLink
      - identitylink_to_individual         # IdentityLink      -> Individual
      - individual_wrote_prescription      # Individual        -> Prescription
    dedupe_on: UnifiedIndividual.UnifiedRecordId__c
    fan_out: true                           # 1:N present -> MUST count DISTINCT anchor

# -----------------------------------------------------------------------------
# JOURNEYS  (worked NL examples -> how the pieces assemble)
# -----------------------------------------------------------------------------
journeys:

  brand_web_visitors_by_state:
    intent: "How many opted-in <brand> HCPs in <state> visited the website in the last 60 days?"
    anchor: UnifiedIndividual
    # State comes from ContactPointAddress, so this ask spans two child paths off the
    # same person: web engagement AND address. Traverse both and dedupe on the anchor.
    path: unified_individual_to_web_engagement
