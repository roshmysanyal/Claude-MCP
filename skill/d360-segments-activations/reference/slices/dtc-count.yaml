# Count hot-path slice for patients (DTC). Source of truth for new fields:
# ../dataModel-dtc.yaml — keep this file in sync when Brand / identity keys change.
# COUNT.md: read this instead of the full YAML. Grep the full file only if the
# concept is not listed here.

dataspace: DTC
anchor_dmo: DTC_UnifiedIndividualDtc__dlm
anchor_count_key: Id__c
identity_link_dmo: DTC_UnifiedLinkIndividualDtc__dlm
identity_unified_key: UnifiedRecordId__c
identity_source_key: SourceRecordId__c
individual_dmo: DTC_Individual__dlm
individual_pk: Id__c

# Unified.Id__c IN (link.UnifiedRecordId__c WHERE SourceRecordId__c IN (related FK))
related:
  BrandProfile:
    dmo: DTC_BrandProfile__dlm
    fk: IndividualId__c
    brand_field: Brand__c
    brand_literals:
      - PREMARIN
      - COMIRNATY
      - ESTRING
      - LITFULO
      - GENOTROPIN
      - XELJANZ
      - PAXLOVID
      - DUAVEE
      - CIBINQO
      - NURTEC
      - HYMPAVZI
      - EUCRISA
      - IBRANCE
      - VYNDAMAX
    aliases:
      Pax: PAXLOVID
      Paxlovid: PAXLOVID
      Premarin: PREMARIN
  ContactPointConsent:
    dmo: DTC_ContactPointConsent__dlm
    fk: PartyId__c
    opted_in: "ConsentStatusId__c = 'IN'"
  CopayCard:
    dmo: DTC_CopayCard__dlm
    fk: IndividualId__c
    has_card_number: "CardNumber__c IS NOT NULL AND CAST(CardNumber__c AS VARCHAR) <> ''"
    brand_field: Brand__c
    # never SELECT CardNumber__c

stop:
  email_opens_clicks: do not count — engagement source is not usable
  zip_miles: leave this slice; use reference/zip-radius.md
