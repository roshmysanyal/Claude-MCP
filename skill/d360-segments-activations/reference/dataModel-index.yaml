# =============================================================================
# Data Model index — all dataspaces
# =============================================================================
# Org catalog (Data Spaces UI, 2026-08-12):
#   DEV-US, STG-US, PRD-US  → US Customer Data = HCP
#   DTC, PRD-PAT            → Patient / consumer = DTC audience
#   LAB                     → Lab sandbox
# API dataspace names (MCP) may differ from UI labels (e.g. DEV-US → Development).
# Seeded 2026-08-07 from d360_dataspace_list + d360_dmo_list / d360_dmo_get;
# audience rule confirmed 2026-08-12.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Audience rule (always)
#   • US Customer Data spaces (DEV-US / STG-US / PRD-US) → HCP
#   • Patient spaces (DTC / PRD-PAT) → patient / consumer / D2C
# -----------------------------------------------------------------------------

dataspaces:

  Development:
    label: DEV-US
    org_description: Development environment for US Customer Data
    prefix: dev_
    audience: HCP
    audience_rule: US Customer Data = HCP
    file: dataModel-dev.yaml
    status: ready
    segment_on: dev_UnifiedIndividualRs1__dlm
    note: POC default for HCP counts and segments. MCP API name is Development.

  STG_US:
    label: STG-US
    org_description: Staging environment for US Customer Data
    prefix: stg_
    audience: HCP
    audience_rule: US Customer Data = HCP
    file: dataModel-stg-us.yaml
    status: ready
    segment_on: stg_UnifiedIndividual__dlm
    note: Staging HCP. Identity link DMO is stg_IndividualIdentityLink__dlm.

  PRD_US:
    label: PRD-US
    org_description: Production environment for US Customer Data
    prefix: prd_
    audience: HCP
    audience_rule: US Customer Data = HCP
    file: dataModel-prd-us.yaml
    status: ready
    segment_on: prd_UnifiedIndividualPrd1__dlm
    note: Production HCP. Explicit request + governance sign-off required.

  DTC:
    label: DTC
    org_description: DTC
    prefix: DTC_
    audience: PATIENT
    audience_rule: Patient spaces = DTC / D2C
    file: dataModel-dtc.yaml
    status: ready
    segment_on: DTC_UnifiedIndividualDtc__dlm
    note: Default for patient/consumer asks. Live patient data for the POC.

  PRD_PAT:
    label: PRD-PAT
    org_description: Patient Production Data Space
    prefix: ppt_
    audience: PATIENT
    audience_rule: Patient spaces = DTC / D2C
    file: dataModel-prd-pat.yaml
    status: empty
    segment_on: null
    note: >-
      Patient production (empty at seed — currency rates only). Do not query for
      audiences; offer DTC for live patient/D2C data.

  LAB:
    label: LAB
    org_description: LAB
    prefix: LAB_
    audience: LAB
    file: dataModel-lab.yaml
    status: ready
    segment_on: LAB_Individual__dlm
    note: Lab sandbox. No IR/unified layer. Anchor on Individual directly.

  # Not shown in the 2026-08-12 Data Spaces UI list; retained if still present in org.
  DEV_PAT:
    label: DEV-PAT
    org_description: Patient development (if present)
    prefix: dpt_
    audience: PATIENT
    audience_rule: Patient spaces = DTC / D2C
    file: dataModel-dev-pat.yaml
    status: optional
    segment_on: dpt_UnifiedIndividualPatd__dlm
    note: >-
      Patient development. Thinner than DTC. Prefer DTC unless the user names DEV-PAT.

  default:
    label: default
    prefix: ""
    audience: UNKNOWN
    file: dataModel-default.yaml
    status: inventory
    segment_on: null
    note: Standard ssot__ catalog; Individual not enabled/segmentable. Avoid for POC.

routing_defaults:
  HCP: Development
  PATIENT: DTC
  # When user says Dev / Stage / Prod without audience:
  #   US Customer (HCP) → Development / STG_US / PRD_US
  #   Patient → DTC (not PRD_PAT — empty); never use a US-* space for patients
  us_customer_spaces: [Development, STG_US, PRD_US]
  patient_spaces: [DTC, PRD_PAT]
  explicit_dataspace_wins: true
  ambiguous_audience: ask
