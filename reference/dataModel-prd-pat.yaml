# =============================================================================
# Data 360 Data Model — PRD_PAT (Patient production / PRD-PAT)
# =============================================================================
# ROUTING
#   Audience: PATIENT (production). Explicit PRD_PAT / PRD-PAT only.
#
# ORG SEED (MCP, 2026-08-07)
#   Dataspace: PRD_PAT (label PRD-PAT, prefix `ppt_`)
#   DATA MODEL IS EMPTY of segmentable profiles — only Static Currency Rates
#   DMOs were returned by d360_dmo_list. No Individual / UnifiedIndividual /
