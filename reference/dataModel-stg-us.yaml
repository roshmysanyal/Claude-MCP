          restrictions; COUNT(DISTINCT NPI) for benchmarks remains allowed.

# -----------------------------------------------------------------------------
# RELATIONSHIPS  (edges)  -- declared, directional, with cardinality
# -----------------------------------------------------------------------------
# Join keys + cardinality verified 2026-08-06 against STG_US via MCP (DMO names remapped from Development)
# (d360_dmo_get + join-count SQL). Note: Id__c may still pair with KQ_* key
# qualifiers for segment SQL projection — see creating-segments.md.
# -----------------------------------------------------------------------------
relationships:

  - name: unified_to_identitylink
    status: verified
    kind: identity_resolution
    from: UnifiedIndividual
    to: IdentityLink
    from_key: Id__c
    to_key: UnifiedRecordId__c
    cardinality: one_to_many                # unified unified -> source links at seed

  - name: identitylink_to_individual
    status: verified
    kind: identity_resolution
    from: IdentityLink
    to: Individual
    from_key: SourceRecordId__c
    to_key: Id__c
    cardinality: one_to_one                 # each link row maps to one source individual

  - name: individual_has_email
    status: verified
    kind: contact_point
    from: Individual
    to: ContactPointEmail
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # join confirmed 2026-08-06 (~1.4M matches)

  - name: individual_has_address
    status: verified
    kind: contact_point
    from: Individual
    to: ContactPointAddress
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # keys confirmed; 0 address rows at seed

  - name: individual_has_consent
    status: verified
    kind: consent
    from: Individual
    to: ContactPointConsent
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # keys confirmed; 0 consent rows at seed

  - name: individual_has_party_identification
    status: verified
    kind: identifier
    from: Individual
    to: PartyIdentification
    from_key: Id__c
    to_key: PartyId__c
    cardinality: one_to_many                # join confirmed 2026-08-07 (join confirmed in Development; re-confirm in STG_US)

  - name: consent_has_preference
    status: verified
    kind: consent
    from: ContactPointConsent
    to: ConsentPreference
    from_key: Id__c
    to_key: ContactPointConsentId__c
    cardinality: one_to_many                # keys confirmed; 0 preference rows at seed

  - name: individual_has_hcp_segmentation
    status: verified
    kind: attribute
    from: Individual
    to: HcpSegmentation
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many

  - name: individual_has_hq_email_engagement
    status: VERIFY
    kind: engagement_event
    from: Individual
    to: HeadquarterEmailEngagement
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many
    note: Confirm IndividualId__c (or PartyId__c) on HeadquarterEmailEngagement before use.

  - name: individual_has_iqvia_competitor_sales
    status: VERIFY
    kind: transactional_event
    from: Individual
    to: IQVIACompetitorSalesFact
    from_key: Id__c
    to_key: IndividualId__c
    cardinality: one_to_many
    note: Confirm person-link field on IQVIACompetitorSalesFact before use.

# -----------------------------------------------------------------------------
# PATHS  (named multi-hop traversals)
# -----------------------------------------------------------------------------
# STG_US does NOT have EmailEngagement / WebsiteEngagement / NBRxAggregated /
# HeaderUnsubscribeBrand DMOs. Use HeadquarterEmailEngagement for HQ email.
# -----------------------------------------------------------------------------
paths:

  unified_individual_to_source:
    description: Resolve a unified profile down to its source individual record(s).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_email:
    description: From a resolved person to their email contact points.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_email
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_address:
    description: From a resolved person to their address contact points (state/region).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_address
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_consent:
    description: From a resolved person to contact-point consent (opt-in / opt-out).
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_consent
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_npi:
    description: >-
      From a resolved person to their NPI (PartyIdentification.IdentificationNumber__c
      filtered to the NPI type). Deduplicate on the number when counting DISTINCT NPI.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_party_identification
    dedupe_on: PartyIdentification.IdentificationNumber__c
    fan_out: true
    filter_hint: >-
      Restrict to NPI rows via Name__c / PartyIdentificationTypeId__c once those
      literals are confirmed (seed currently only has MC Subscriber Key in Development).

  unified_individual_to_hcp_segmentation:
    description: From a resolved HCP to brand/indication segmentation attributes.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_hcp_segmentation
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true

  unified_individual_to_hq_email_engagement:
    description: From a resolved HCP to STG Headquarter email engagement events.
    hops:
      - unified_to_identitylink
      - identitylink_to_individual
      - individual_has_hq_email_engagement
    dedupe_on: UnifiedIndividual.Id__c
    fan_out: true
    status: VERIFY

# -----------------------------------------------------------------------------
# JOURNEYS
# -----------------------------------------------------------------------------
journeys:

  stg_hq_email_engaged_hcps:
    intent: "How many HCPs engaged with a headquarter email in STG?"
    anchor: UnifiedIndividual
    path: unified_individual_to_hq_email_engagement
    count: "COUNT(DISTINCT UnifiedIndividual.count_key)"
    caveats:
      - "Person-link field on HeadquarterEmailEngagement is VERIFY."
      - "Standard EmailEngagement DMO is not present in STG_US."

