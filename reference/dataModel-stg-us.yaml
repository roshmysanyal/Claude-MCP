# =============================================================================
# Data 360 Data Model — STG-US (HCP semantic layer)
# File: dataModel-stg-us.yaml
# =============================================================================
# ROUTING
#   This file is the HCP model for dataspace STG_US (STG-US, `stg_`).
#   Sibling of Development (dataModel-dev.yaml). Route here when the user explicitly asks for STG_US / STG-US.
#   POC default remains Development — do not use this file unless named.
#   Catalog of all spaces: dataModel-index.yaml.
#   Ambiguous audience -> ask, don't guess. Never join across dataspaces.
#   See the Skill's "Semantic layer routing" section.
#
# PII PASS (2026-08-07, mirrored from dataModel-dev.yaml)
#   pii:true  = filter only; never return literals / never SELECT the column in
#               marketer-facing output. Counts and membership lists of opaque IDs OK.
#   pii:false = safe to filter; categorical non-PII may be profiled / shown in
#               aggregates. Fields marked review: need architect confirmation.
#   COUNT RULE: HCP count answers return the number only — never accompany a
#               count with PII sample rows. Applies in this STG_US dataspace the
#               same as Development / PRD_US. See the Skill "PII-safe counts" section.
#
# PURPOSE
#   Single source of truth for the Data 360 data model as the agent should use it:
#     (a) FIELD METADATA  — the real DMO + field API names, data types, PII flags,
#         and what each field means in business terms (the "which field do I
#         filter on?" answer).
#     (b) RELATIONSHIPS    — the declared join graph: edges, join keys, cardinality,
#         and reusable multi-hop paths (the "how do I join them?" answer).
#
#   The agent must build queries from THIS FILE, not by inferring from field names.
#   In the SSOT model an "...Id" suffix does NOT imply a foreign key, and real
#   relationships are frequently on fields that carry no "Id" at all. Guessing
#   from names produces confident-but-wrong joins and silent double-counting.
#
# HOW IT'S POPULATED / VERIFIED
#   - Field-level facts (dmo, api_name, type, primary_key) can be SEEDED and
#     CONFIRMED from the org via the MCP Query family's metadata query (list DMOs
#     + describe fields). This half is machine-verifiable.
#   - Relationships, cardinality, identity-resolution routing, count semantics,
#     PII flags, and business descriptions are HUMAN-CURATED and architect-verified.
#     The metadata API does not reliably emit these.
#   See:  using-the-data-model.md            (how the agent uses this file)
#         before-using-and-on-data-model-changes.md  (how to verify / maintain it)
#
# ORG SEED (MCP, 2026-08-07) — enriched from dataModel-dev.yaml PII/desc/sampleValues pass
#   Dataspace: STG_US (label STG-US, prefix `stg_`)
#   Seeded via: d360_dmo_list / d360_dmo_get / d360_query_sql (join sanity checks)
#   Populated entities below replace the generic ssot__* placeholders.
#   DMO inventory confirmed via MCP (2026-08-07). PII/desc/sampleValues mirrored
#   from dataModel-dev.yaml; re-profile STG literals before treating as authoritative.
#   Present: profile, contact points, consent, HcpSegmentation, PartyIdentification,
#            LegalExclusion, HeadquarterEmailEngagement, IQVIACompetitorSalesFact
#   Absent as DMOs: EmailEngagement, WebsiteEngagement, NBRxAggregated,
#                   HeaderUnsubscribeBrand
#   Identity link DMO: stg_IndividualIdentityLink__dlm (not UnifiedLink*).
#
# IDENTITY RESOLUTION RULE (important)
#   You CANNOT join the unified profile directly to a source individual. You must
#   traverse the identity link DMO:
#       UnifiedIndividual.Id__c
#           = IdentityLink.UnifiedRecordId__c
#       IdentityLink.SourceRecordId__c
#           = Individual.Id__c
#
# STATUS LEGEND (per entity / field / relationship)
#   verified   -> confirmed against the live org (metadata query and/or SME)
#   VERIFY     -> placeholder; confirm the DMO/field/type/cardinality before trusting
# =============================================================================

version: 1

defaults:
  dialect: postgresql          # Data 360 Query API v2 dialect
  dataspace: STG_US
  dataspace_label: STG-US
  audience: HCP
  anchor: UnifiedIndividual    # default "people" entity for counts
  # Counting rule: a person = one distinct anchor count_key, regardless of how
  # many child rows (Rx, engagements, accounts) they fan out to.

# -----------------------------------------------------------------------------
# ENTITIES  (nodes)  — DMO + field metadata
# -----------------------------------------------------------------------------
# Per entity:  dmo, dataspace, dataspace_label, label, status, desc, grain,
#              count_key/primary_key
# Per field:   api_name (real column), label, type, status, pii (bool), desc, sampleValues?
#              -> `type` and `api_name` are metadata-query verifiable
#              -> `desc` and `pii` are human-curated context
#              -> `label` = the business-friendly display name shown to MARKETERS.
#              -> `sampleValues` = illustrative literals for low-cardinality non-PII
#                 categorical fields only. NEVER on PII / free-text / timestamps / IDs.
#              -> `dataspace` / `dataspace_label` = live org dataSpaceName + UI label
#                 (confirmed via d360_dmo_list / d360_dmo_get). Queries MUST pass
#                 dataspace=STG_US for these DMOs.
# -----------------------------------------------------------------------------
entities:

  # ---- Unified/resolved profile --------------------------------------------
  UnifiedIndividual:
    dmo: stg_UnifiedIndividual__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: HCP
    status: verified            # DMO exists + fields from d360_dmo_get 2026-08-06
    desc: >-
      Resolved "golden" HCP record (IR (STG IndividualIdentityLink)) in the STG_US dataspace;
      the anchor for all people counts.
    grain: one row per resolved person
    count_key: Id__c            # COUNT(DISTINCT this) == # of people
    primary_key: Id__c
    fields:
      unified_record_id:
        api_name: Id__c
        label: HCP ID
        type: Text
        status: verified
        pii: false
        desc: >-
          Resolved-person primary key (IR (STG IndividualIdentityLink)). Join target from
          IdentityLink.UnifiedRecordId__c. Use as COUNT(DISTINCT …) count key
          and as SegmentOn PK when segmenting on the unified profile.
      first_name:
        api_name: FirstName__c
        label: First name
        type: Text
        status: verified
        pii: true
        desc: Given name of the HCP. Filter only — never return in results or dumps.
      last_name:
        api_name: LastName__c
        label: Last name
        type: Text
        status: verified
        pii: true
        desc: Family name of the HCP. Filter only — never return in results or dumps.
      salutation:
        api_name: Salutation__c
        label: Salutation
        type: Text
        status: verified
        pii: false
        desc: >-
          Honorific (Mr., Mrs., Dr., …). Safe to filter and to show in aggregate
          breakdowns. Not a direct identifier on its own.
      birth_date:
        api_name: BirthDate__c
        label: Date of birth
        type: DateTime
        status: verified
        pii: true
        desc: >-
          HCP date of birth. Direct personal attribute — filter only (e.g. age
          windows if ever needed); never return the date itself.
      primary_specialty:
        api_name: PrimarySpecialty__c
        label: Primary specialty
        type: Text
        status: verified
        pii: false
        desc: >-
          Clinical specialty label on the resolved profile (e.g. Oncology). Use
          for specialty-based HCP counts. Observed all-null at seed (2026-08-06);
          keep for filters once populated.
      primary_specialty_code:
        api_name: PrimarySpecialtyCode__c
        label: Primary specialty code
        type: Text
        status: verified
        pii: false
        desc: >-
          Coded form of primary specialty. Prefer this for exact filters when
          codes are known; use PrimarySpecialty__c for label matching.
      secondary_specialty:
        api_name: SecondarySpecialty__c
        label: Secondary specialty
        type: Text
        status: verified
        pii: false
        desc: Secondary clinical specialty label on the resolved profile.
      profession:
        api_name: Profession__c
        label: Profession
        type: Text
        status: verified
        pii: false
        desc: >-
          Profession on the HCP profile (e.g. Physician, NP, PA). Categorical —
          safe to filter and profile.
      hcp_type:
        api_name: HcpType__c
        label: HCP type
        type: Text
        status: verified
        pii: false
        desc: >-
          HCP type classifier on the resolved profile. Schema present; **no
          values populated** in STG_US at profile (2026-08-07) —
          Unified has '' on all unified rows; Individual is NULL on all source.
          Cannot filter on this until the source feed lands.
        review: desc
        review_reason: Confirm intended business values once data is loaded (field currently empty org-wide).
      hcp_status_code:
        api_name: HcpStatusCode__c
        label: HCP status
        type: Text
        status: verified
        pii: false
        desc: >-
          Lifecycle/status code for the HCP. Schema present; **no values
          populated** in STG_US at profile (2026-08-07) — same
          empty pattern as HcpType__c. Cannot use for "eligible to target"
          until data lands.
        review: desc
        review_reason: Confirm intended status values (e.g. Active/Inactive) once the feed is populated.
      hcp_suppression:
        api_name: HcpSuppression__c
        label: HCP suppression
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Master suppression flag on the HCP profile. When true, exclude from
          marketable segments (see Development DEV_CIA_HCP_Marketable_Email pattern).
        sampleValues: [true, false]
      pfizer_customer_id:
        api_name: PfizerCustomerId__c
        label: Pfizer customer ID
        type: Text
        status: verified
        pii: true
        desc: >-
          Pfizer customer identifier for the HCP. Treat as a personal identifier —
          filter / join only; never return the value.
      pfizer_employee:
        api_name: PfizerEmployee__c
        label: Pfizer employee
        type: Boolean
        status: verified
        pii: false
        desc: True when the person is a Pfizer employee. Commonly excluded from external audiences.
        sampleValues: [true, false]
      registered_user:
        api_name: RegisteredUser__c
        label: Registered user
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Whether the HCP has a registered PfizerPro digital account.
          Confirmed (architect, 2026-08-07): registration system = PfizerPro.
        sampleValues: [true, false]
      test_user:
        api_name: TestUser__c
        label: Test user
        type: Boolean
        status: verified
        pii: false
        desc: Test-user flag — typically exclude from production counts and segments.
        sampleValues: [true, false]

  # ---- Identity Resolution link ---------------------------------------------
  IdentityLink:
    dmo: stg_IndividualIdentityLink__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: Identity link (internal)          # plumbing — not shown to marketers
    status: verified
    desc: >-
      Bridge between the unified profile and its source records. Named IndividualIdentityLink in STG (not UnifiedLinkIndividual).
      All unified<->source joins MUST route through this DMO. NOTE: STG uses stg_IndividualIdentityLink__dlm (not UnifiedLink*).
    grain: one row per (unified record <-> source record) mapping
    fields:
      unified_record_id:
        api_name: UnifiedRecordId__c
        label: Unified HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: Links to UnifiedIndividual.Id__c. Opaque IR key — not a business identifier.
      source_record_id:
        api_name: SourceRecordId__c
        label: Source HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: Links to Individual.Id__c. Opaque IR key — not a business identifier.
      data_source_id:
        api_name: DataSourceId__c
        label: Data source
        type: Text
        status: verified
        pii: false
        desc: Source system for this link row (part of the bridge composite key).
      data_source_object_id:
        api_name: DataSourceObjectId__c
        label: Data source object
        type: Text
        status: verified
        pii: false
        desc: Source object for this link row (part of the bridge composite key).

  # ---- Source-level individual ----------------------------------------------
  Individual:
    dmo: stg_Individual__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: HCP
    status: verified
    desc: >-
      Source-level HCP record (pre-resolution) in STG_US; carries the HCP
      attributes used in filters. row counts differ from Development — re-profile in STG_US.
    primary_key: Id__c
    grain: one row per source-level individual
    fields:
      id:
        api_name: Id__c
        label: HCP ID
        type: Text
        status: verified
        pii: false
        desc: >-
          Source individual primary key. Join target from
          IdentityLink.SourceRecordId__c and from child PartyId / IndividualId
          fields. When SegmentOn = Individual, project Id__c plus KQ_Id__c.
      party_id:
        api_name: PartyId__c
        label: Party ID
        type: Text
        status: verified
        pii: false
        desc: >-
          Party reference on the individual. Distinct from Id__c in some mappings;
          contact points in this org join on Individual.Id__c via PartyId__c on
          the child (confirmed 2026-08-06).
      birth_date:
        api_name: BirthDate__c
        label: Date of birth
        type: DateTime
        status: verified
        pii: true
        desc: HCP date of birth. Filter only — never return.
      first_name:
        api_name: FirstName__c
        label: First name
        type: Text
        status: verified
        pii: true
        desc: Given name. Filter only — never return.
      last_name:
        api_name: LastName__c
        label: Last name
        type: Text
        status: verified
        pii: true
        desc: Family name. Filter only — never return.
      middle_name:
        api_name: MiddleName__c
        label: Middle name
        type: Text
        status: verified
        pii: true
        desc: Middle name. Filter only — never return.
      salutation:
        api_name: Salutation__c
        label: Salutation
        type: Text
        status: verified
        pii: false
        desc: Honorific (Mr., Mrs., Ms., Dr., …). Safe to filter and aggregate.
      primary_specialty:
        api_name: PrimarySpecialty__c
        label: Primary specialty
        type: Text
        status: verified
        pii: false
        desc: >-
          Clinical specialty on the source record. All-null at seed (2026-08-06)
          across source rows — specialty filters will not match until data lands.
      primary_specialty_code:
        api_name: PrimarySpecialtyCode__c
        label: Primary specialty code
        type: Text
        status: verified
        pii: false
        desc: Coded primary specialty. Prefer for exact-match filters when codes are known.
      secondary_specialty:
        api_name: SecondarySpecialty__c
        label: Secondary specialty
        type: Text
        status: verified
        pii: false
        desc: Secondary clinical specialty label.
      secondary_specialty_code:
        api_name: SecondarySpecialtyCode__c
        label: Secondary specialty code
        type: Text
        status: verified
        pii: false
        desc: Coded secondary specialty.
      profession:
        api_name: Profession__c
        label: Profession
        type: Text
        status: verified
        pii: false
        desc: Profession on the source HCP record (Physician, NP, PA, …).
      hcp_type:
        api_name: HcpType__c
        label: HCP type
        type: Text
        status: verified
        pii: false
        desc: >-
          HCP type classifier on the source record. **All NULL** across source
          Individual rows in Development and PRD_US (2026-08-07).
        review: desc
        review_reason: Same as UnifiedIndividual.HcpType__c — confirm business values once populated.
      hcp_status_code:
        api_name: HcpStatusCode__c
        label: HCP status
        type: Text
        status: verified
        pii: false
        desc: >-
          HCP lifecycle/status code on the source record. **All NULL** across
          source Individual rows in Development and PRD_US (2026-08-07).
        review: desc
        review_reason: Same as UnifiedIndividual.HcpStatusCode__c — confirm eligible values once populated.
      hcp_suppression:
        api_name: HcpSuppression__c
        label: HCP suppression
        type: Boolean
        status: verified
        pii: false
        desc: Suppression flag on the source record. Exclude when true for marketable audiences.
        sampleValues: [true, false]
      pfizer_customer_id:
        api_name: PfizerCustomerId__c
        label: Pfizer customer ID
        type: Text
        status: verified
        pii: true
        desc: Pfizer customer identifier. Personal identifier — filter/join only; never return.
      pfizer_employee:
        api_name: PfizerEmployee__c
        label: Pfizer employee
        type: Boolean
        status: verified
        pii: false
        desc: True when the person is a Pfizer employee. Commonly excluded from external audiences.
        sampleValues: [true, false]
      registered_user:
        api_name: RegisteredUser__c
        label: Registered user
        type: Boolean
        status: verified
        pii: false
        desc: >-
          Whether the HCP has a registered PfizerPro digital account.
          Confirmed (architect, 2026-08-07): registration system = PfizerPro.
        sampleValues: [true, false]
      test_user:
        api_name: TestUser__c
        label: Test user
        type: Boolean
        status: verified
        pii: false
        desc: Test-user flag — typically exclude from production counts and segments.
        sampleValues: [true, false]
      validation_status:
        api_name: ValidationStatus__c
        label: Validation status
        type: Text
        status: verified
        pii: false
        desc: >-
          Profile validation status from the source system. **Unpopulated** at
          seed (Individual NULL × 1.51M; Unified '' × 1.09M). Meaning of each
          status still TBD — do not filter until values and semantics are known.
        review: desc
        review_reason: >-
          Architect deferred — confirm meaning of each ValidationStatus__c value
          once the field is populated (valid / pending / rejected / …).
      gender:
        api_name: GenderId__c
        label: Gender
        type: Text
        status: verified
        pii: true
        desc: >-
          Gender code/id. Treat as personal attribute — filter only; never return
          or dump value breakdowns that could be joined back to individuals.

  # ---- Contact point: email -------------------------------------------------
  ContactPointEmail:
    dmo: stg_ContactPointEmail__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: Email
    status: verified
    optional: true
    desc: >-
      Email contact points attached to the source Individual via PartyId.
      One person can have many. Source of "has email". Opt-in/out is NOT on this
      DMO in STG_US — see ContactPointConsent / ConsentPreference /
      HeadquarterEmailEngagement (STG has no EmailEngagement DMO).
    primary_key: Id__c
    grain: one row per email contact point
    fields:
      id:
        api_name: Id__c
        label: Email contact point ID
        type: Text
        status: verified
        pii: false
        desc: Contact-point primary key. Opaque system ID — safe as a join key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: Links to Individual.Id__c (party-linking pattern; join confirmed 2026-08-06).
      email_address:
        api_name: EmailAddress__c
        label: Email address
        type: Text
        status: verified
        pii: true
        desc: >-
          Full email address. Use for existence checks ("has email") via joins /
          IS NOT NULL — never SELECT or return the address itself.
      email_domain:
        api_name: EmailDomain__c
        label: Email domain
        type: Text
        status: verified
        pii: false
        desc: >-
          Domain portion of the email (e.g. hospital.org). Used for
          test/internal-domain exclusions. Not a direct identifier on its own.
        review: pii
        review_reason: >-
          Confirm org policy — personal domains (gmail.com) are usually fine to
          aggregate; rare custom domains could be identifying for small practices.
      is_active:
        api_name: IsActive__c
        label: Active
        type: Text
        status: verified
        pii: false
        desc: >-
          Active flag on the email contact point (stored as Text, not Boolean).
          Architect guidance (2026-08-07): expect Yes / True style literals.
          **Observed at seed:** all NULL across email email rows — no live
          vocabulary yet. Prefer PrimaryFlag__c for "primary email" until
          IsActive is populated.
        sampleValues: ["Yes", "True"]
        review: desc
        review_reason: >-
          Re-profile when IsActive__c is populated; confirm casing
          (Yes/True/true/TRUE) and inactive counterpart (No/False).
      primary_flag:
        api_name: PrimaryFlag__c
        label: Primary email
        type: Text
        status: verified
        pii: false
        desc: >-
          Whether this is the primary email contact point (stored as Text).
          Architect guidance (2026-08-07): Yes or True.
          **Observed at seed:** every email row is '1' (email). CIA reference
          segments historically filter PrimaryFlag__c = 'true' — treat '1' /
          'true' / 'True' / 'Yes' as primary until a single literal is locked.
        sampleValues: ["1", "true", "True", "Yes"]
        review: desc
        review_reason: >-
          Lock the canonical primary literal. Live data = '1'; CIA segments use
          'true'; architect said Yes/True. Update sampleValues + segment recipes
          once decided.

  # ---- Contact point: address -----------------------------------------------
  ContactPointAddress:
    dmo: stg_ContactPointAddress__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: Address
    status: verified
    desc: >-
      Postal/geographic contact points attached to the source Individual via PartyId.
      State/region lives here (StateProvinceId__c) — NOT on Individual.
      Schema mapped; 0 rows at seed (2026-08-06) — state filters will return 0 until data lands.
    primary_key: Id__c
    grain: one row per address contact point
    fields:
      id:
        api_name: Id__c
        label: Address contact point ID
        type: Text
        status: verified
        pii: false
        desc: Contact-point primary key. Opaque system ID — safe as a join key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: Links to Individual.Id__c (party-linking pattern).
      state:
        api_name: StateProvinceId__c
        label: State/region
        type: Text
        status: verified
        pii: false
        desc: >-
          State/region on the address (NOT on Individual). Map spoken names to
          stored codes ("Utah" → 'UT') once values are observed. Empty table at
          seed (2026-08-06) — state filters return 0 until address data lands.
      country:
        api_name: CountryId__c
        label: Country
        type: Text
        status: verified
        pii: false
        desc: Country on the address. Safe to filter; VERIFY stored codes (US vs USA).
      city:
        api_name: CityId__c
        label: City
        type: Text
        status: verified
        pii: false
        desc: City on the address. Safe for coarse filters; avoid returning with other identifiers.
        review: pii
        review_reason: >-
          City alone is usually non-PII; confirm whether your classification
          treats city + specialty (or small towns) as sensitive.
      postal_code:
        api_name: PostalCodeId__c
        label: Postal code
        type: Text
        status: verified
        pii: true
        desc: >-
          Postal/ZIP code. Quasi-identifier — OK to filter (e.g. radius / ZIP list
          asks) but never return the code alongside other person attributes.
        review: pii
        review_reason: >-
          Marked pii:true conservatively. Confirm whether ZIP5-only aggregates
          are allowed in marketer-facing breakdowns (some orgs allow ZIP3/ZIP5).
      address_line_1:
        api_name: AddressLine1__c
        label: Address line 1
        type: Text
        status: verified
        pii: true
        desc: Street address. Direct PII — never return; filter only if governance explicitly allows.
      is_active:
        api_name: IsActive__c
        label: Active
        type: Text
        status: verified
        pii: false
        desc: Active flag on the address contact point (stored as Text).
      primary_flag:
        api_name: PrimaryFlag__c
        label: Primary address
        type: Text
        status: verified
        pii: false
        desc: Whether this is the primary address contact point.

  # ---- Contact point consent (opt-in / opt-out) ------------------------------
  ContactPointConsent:
    dmo: stg_ContactPointConsent__dlm
    dataspace: STG_US
    dataspace_label: STG-US
    label: Consent
    status: verified
    optional: true
    desc: >-
      Consent granted by a party for a specific contact point (where/when/how/purpose).
      Preferred source of "opted-in / emailable" once populated. 0 rows at seed
      (seed empty in Development) — until populated in STG, HeadquarterEmailEngagement
      may be an interim engagement signal (VERIFY action literals / person-link).
    primary_key: Id__c
    grain: one row per contact-point consent record
    fields:
      id:
        api_name: Id__c
        label: Consent ID
        type: Text
        status: verified
        pii: false
        desc: Consent primary key.
      party_id:
        api_name: PartyId__c
        label: HCP ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> Individual.Id__c
      contact_point_id:
        api_name: ContactPointId__c
        label: Contact point ID (link)
        type: Text
        status: verified
        pii: false
        desc: -> ContactPointEmail.Id__c (or other contact point).
      consent_status:
        api_name: ConsentStatusId__c
        label: Consent status
        type: Text
        status: verified
        pii: false
        desc: >-
          Consent status. Opted-in / emailable in live CIA segments uses
          ConsentStatusId__c IN ('IN', 'UNKNOWN') — harvested from
          DEV_CIA_Nurtec_HCP_Segmentation / DEV_CIA_HCP_Marketable_Email (Development recipes)
          (2026-08-06). ContactPointConsent may be empty until data lands.
        sampleValues: ["IN", "UNKNOWN"]
      consent_captured_date:
